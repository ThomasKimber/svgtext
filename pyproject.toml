[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svgtext"
version = "0.0.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.65.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pytest-playwright>=0.10.0",
    "tpipe",
]

[tool.hatch.build.targets.wheel]
packages = ["src/svgtext"]
artifacts = ["src/svgtext/fonts/*"]

[tool.uv.sources]
tpipe = { url = "https://github.com/ThomasKimber/tpipe/releases/download/v0.001/tpipe-0.1.0-py3-none-any.whl" }
